[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"app.agent.prompts" = ["*.md", "*.yaml", "stacks/*.md"]
"app.llm.catalog" = ["*.yaml"]

[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.1",
  "httpx>=0.28.1",
  "idna>=3.18",
  "mako>=1.3.12",
  "pyjwt[crypto]>=2.13.0",
  "starlette>=1.3.1",
  "sqlalchemy[asyncio]>=2.0.51",
  "asyncpg>=0.31.0",
  "alembic>=1.18.5",
  "arq>=0.28.0",
  # redis-py <6 required by arq; 5.x clients work with Redis server 7+
  "redis>=8.1.0,<9",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "cryptography>=50.0.0",
  "tiktoken>=0.13.0",
  "anthropic>=0.120.2",
  "unidiff>=1.0.0",
  "pyyaml>=6.0.3",
  "tree-sitter-language-pack>=1.13.7,<1.13.8",
  "langfuse>=4.14.2",
  "sentry-sdk[fastapi]>=2.66.1",
  "openai>=2.52.0",
  "boto3>=1.43.62",
  "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "mypy>=2.3.0",
  "bandit>=1.9.4",
  "types-PyYAML>=6.0.12.20260724",
  "types-unidiff>=0.7.0.20260727",
  "pip-audit>=2.10.1",
]
deepeval = [
  "deepeval>=4.1.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "live_github: integration test that hits the real GitHub API",
  "live_llm: test that hits live LLM APIs",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_return_any = false
disallow_any_generics = false

[tool.bandit]
exclude_dirs = ["tests", "src/api.egg-info"]
