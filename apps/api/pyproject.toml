[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"app.agent.prompts" = ["*.md", "*.yaml", "stacks/*.md"]
"app.llm.catalog" = ["*.yaml"]

[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.139.0",
  "uvicorn[standard]>=0.50.2",
  "httpx>=0.28.1",
  "idna>=3.18",
  "mako>=1.3.12",
  "pyjwt[crypto]>=2.13.0",
  "starlette>=1.3.1",
  "sqlalchemy[asyncio]>=2.0.51",
  "asyncpg>=0.31.0",
  "alembic>=1.18.5",
  "arq>=0.28.0",
  # redis-py <6 required by arq; 5.x clients work with Redis server 7+
  "redis>=8.0.1,<9",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "cryptography>=49.0.0",
  "tiktoken>=0.13.0",
  "anthropic>=0.116.0",
  "unidiff>=0.7.5",
  "pyyaml>=6.0.3",
  "tree-sitter-language-pack>=1.12.5,<1.12.6",
  "langfuse>=4.13.1",
  "sentry-sdk[fastapi]>=2.64.0",
  "openai>=2.44.0",
  "boto3>=1.43.42",
  "mcp>=1.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "mypy>=2.1.0",
  "bandit>=1.9.4",
  "types-PyYAML>=6.0.12.20260518",
  "types-unidiff>=0.7.0.20260518",
  "pip-audit>=2.10.1",
]
deepeval = [
  "deepeval>=4.0.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "live_github: integration test that hits the real GitHub API",
  "live_llm: test that hits live LLM APIs",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_return_any = false
disallow_any_generics = false

[tool.bandit]
exclude_dirs = ["tests", "src/api.egg-info"]
