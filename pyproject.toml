[tool.uv.workspace]
members = ["apps/api"]

[tool.uv]
dev-dependencies = [
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]
override-dependencies = [
  "msgpack>=1.2.1",
  "python-multipart>=0.0.31",
  "pip>=26.1.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
