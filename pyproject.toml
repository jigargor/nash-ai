[tool.uv.workspace]
members = ["apps/api"]

[tool.uv]
dev-dependencies = [
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]
override-dependencies = [
  "msgpack>=1.2.1",
  "python-multipart>=0.0.31",
  # Transitive advisories flagged by pip-audit (kept until upstream bumps land):
  "pip>=26.2",                 # PYSEC-2026-3721
  "aiohttp>=3.14.3",           # PYSEC-2026-3545/3546/3547
  "click>=8.3.3",              # PYSEC-2026-2132
  "setuptools>=83.0.0",        # PYSEC-2026-3447
  "anyio>=4.14.2",             # PYSEC-2026-4024/4025
  "urllib3>=2.8.0",            # PYSEC-2026-4175/4176/4177
]

[tool.ruff]
line-length = 100
target-version = "py312"

# Mirrors apps/api/pyproject.toml [tool.mypy] so pre-commit (which runs from the repo root with
# `--config-file pyproject.toml`) enforces the same strictness as CI (`cd apps/api && mypy src`).
[tool.mypy]
python_version = "3.12"
mypy_path = "apps/api/src"
strict = true
warn_return_any = false
disallow_any_generics = false
