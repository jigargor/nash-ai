name: Quality Gates

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "pyproject.toml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/quality-gates.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "pyproject.toml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/quality-gates.yml"

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codereview
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dev -d codereview"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://dev:dev@localhost:5433/codereview
      TEST_DATABASE_URL: postgresql+asyncpg://dev:dev@localhost:5433/codereview_test
      GITHUB_APP_ID: ${{ secrets.APP_ID || '0' }}
      GITHUB_WEBHOOK_SECRET: ${{ secrets.APP_WEBHOOK_SECRET || 'test-webhook-secret' }}
      GITHUB_CLIENT_ID: ${{ secrets.APP_CLIENT_ID || 'test-client-id' }}
      GITHUB_CLIENT_SECRET: ${{ secrets.APP_CLIENT_SECRET || 'test-client-secret' }}
      APP_PRIVATE_KEY_PEM_PATH: private-key.pem
      FERNET_KEY: 4nYA5RU2f22W4DvwW8Hpt4W6YKfYwQMUqlGQv6ygfA4=
      ANTHROPIC_API_KEY: test-anthropic-key
      ENVIRONMENT: development
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Materialize GitHub App private key
        shell: bash
        run: |
          if [ -n "${{ secrets.APP_PRIVATE_KEY_PEM }}" ]; then
            printf '%s\n' "${{ secrets.APP_PRIVATE_KEY_PEM }}" > private-key.pem
          fi
      - name: Fail on merge conflict markers
        shell: bash
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!uv.lock' ':!pnpm-lock.yaml'; then
            echo "Merge conflict markers found."
            exit 1
          fi
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src
      - name: Migrations
        run: uv run alembic upgrade head
      - name: Pytest (with coverage)
        run: uv run pytest --cov=src/app --cov-report=json:coverage.json --cov-report=term-missing
      - name: Enforce per-module coverage thresholds
        run: uv run python scripts/check_coverage.py coverage.json coverage_thresholds.json
      - name: Bandit
        run: uv run bandit -r src
      - name: Audit Python dependencies
        run: uv run pip-audit

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Web lint
        run: pnpm --filter web lint
      - name: Web typecheck
        run: pnpm --filter web typecheck
      - name: Web tests
        run: pnpm --filter web test
      - name: Web build
        run: pnpm --filter web build
      - name: Audit Node dependencies
        run: pnpm audit --audit-level high

  shared-types-drift:
    runs-on: ubuntu-latest
    env:
      GITHUB_APP_ID: "0"
      GITHUB_WEBHOOK_SECRET: test-webhook-secret
      FERNET_KEY: 4nYA5RU2f22W4DvwW8Hpt4W6YKfYwQMUqlGQv6ygfA4=
      DATABASE_URL: postgresql+asyncpg://dev:dev@localhost:5433/codereview
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: uv sync --extra dev
        working-directory: apps/api
      - name: Export Pydantic schema
        run: uv run python scripts/export_shared_schema.py
        working-directory: apps/api
      - name: Regenerate shared-types from schema
        run: node packages/shared-types/scripts/gen-types.mjs
      - name: Fail on shared-types drift
        shell: bash
        run: |
          if ! git diff --exit-code -- packages/shared-types/src/generated.ts packages/shared-types/generated/pydantic-schema.json; then
            echo "shared-types drift: run 'pnpm gen:types' and commit the result."
            exit 1
          fi

  evals:
    # Harness smoke runs on every prompt-change PR at $0 (offline stub, dry-run).
    # The live gate runs only when ANTHROPIC_API_KEY is configured as a repository secret.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'prompt-change')
    env:
      GITHUB_APP_ID: "0"
      GITHUB_WEBHOOK_SECRET: test-webhook-secret
      FERNET_KEY: 4nYA5RU2f22W4DvwW8Hpt4W6YKfYwQMUqlGQv6ygfA4=
      DATABASE_URL: postgresql+asyncpg://dev:dev@localhost:5433/codereview
      ANTHROPIC_API_KEY: ${{ secrets.EVALS_ANTHROPIC_API_KEY }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install backend dependencies
        run: uv sync --extra dev
      - name: Regenerate mutation-seeded goldens (idempotent)
        run: uv run python ../../evals/harness/mutations.py --generate
      - name: Harness smoke (offline stub, dry-run, zero pipeline errors required)
        run: uv run python ../../evals/harness/run.py --local-only --llm stub --label ci-stub
      - name: Harness live gate (Sonnet 5, fixtures only, cached)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: uv run python ../../evals/harness/run.py --local-only --llm live --label ci-live
      - name: Enforce live golden thresholds
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        shell: bash
        working-directory: .
        run: |
          uv run --project apps/api python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("evals/runs/aggregate-ci-live.json").read_text(encoding="utf-8"))
          if summary["pipeline_error_runs"]:
              raise SystemExit(f"pipeline errors: {summary['pipeline_error_runs']}")
          tp = fp = fn = 0
          for run_dir in sorted(Path("evals/runs").glob("*")):
              golden = run_dir / "golden_diff.json"
              meta = run_dir / "meta.json"
              if not golden.exists() or not meta.exists():
                  continue
              if json.loads(meta.read_text(encoding="utf-8")).get("llm_mode") not in {"live", "cache", "live+cache"}:
                  continue
              g = json.loads(golden.read_text(encoding="utf-8"))
              tp += int(g.get("tp", 0)); fp += int(g.get("fp", 0)); fn += int(g.get("fn", 0))
          precision = tp / (tp + fp) if (tp + fp) else 1.0
          recall = tp / (tp + fn) if (tp + fn) else 1.0
          print(f"live goldens: tp={tp} fp={fp} fn={fn} precision={precision:.2f} recall={recall:.2f}")
          if precision < 0.8 or recall < 0.7:
              raise SystemExit("Eval thresholds failed (precision >= 0.8 and recall >= 0.7 required)")
          PY
      - name: Upload harness artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-harness-runs
          path: |
            evals/runs/**
            evals/critic/**
          if-no-files-found: ignore

